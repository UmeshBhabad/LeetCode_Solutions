name: Update LeetCode Table

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: leetcode-table-update
  cancel-in-progress: false

jobs:
  update-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate table against latest main and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python3 generate_leetcode_index.py

            git add README.md
            if git diff --staged --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "docs: auto-update LeetCode problems table"

            if git push origin main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed, retrying ($i)..."
            sleep 3
          done

          echo "Failed to push after 3 attempts"
          exit 1